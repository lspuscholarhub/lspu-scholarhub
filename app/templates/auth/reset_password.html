{% extends "base.html" %}
{% block title %}Reset Password - LSPU ScholarHub{% endblock %}

{% block content %}
<div class="container py-4 py-md-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow border-0" style="border-radius:12px;">
        <div class="card-body p-4 p-md-5">

          <!-- Header -->
          <div class="text-center mb-4">
            <div class="bg-success bg-opacity-10 rounded-circle d-inline-flex
                        align-items-center justify-content-center mb-3"
                 style="width:64px;height:64px;">
              <i class="bi bi-shield-lock-fill text-success fs-3"></i>
            </div>
            <h2 class="fw-bold mb-1">Set New Password</h2>
            <p class="text-muted small">
              Choose a strong password for your LSPU ScholarHub account.
            </p>
          </div>

          <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


            <!-- New Password -->
            <div class="mb-3">
              <label for="new_password" class="form-label fw-semibold">New Password</label>
              <div class="input-group">
                <input type="password" class="form-control border-end-0"
                       id="new_password" name="new_password"
                       required minlength="8"
                       placeholder="At least 8 characters"
                       autocomplete="new-password">
              </div>
              <div class="form-text">Minimum 8 characters.</div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
              <label for="confirm_password" class="form-label fw-semibold">
                Confirm New Password
              </label>
              <div class="input-group">
                <input type="password" class="form-control border-end-0"
                       id="confirm_password" name="confirm_password"
                       required minlength="8"
                       placeholder="Re-enter your new password"
                       autocomplete="new-password">
              </div>
              <div id="matchMsg" class="form-text"></div>
            </div>

            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-success btn-lg fw-semibold"
                      id="submitBtn">
                <i class="bi bi-check-circle me-2"></i>Reset Password
              </button>
            </div>

          </form>

          <div class="text-center">
            <a href="{{ url_for('auth.login') }}"
               class="small text-decoration-none text-muted">
              <i class="bi bi-arrow-left me-1"></i>Back to Login
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Live password match check
const pw1  = document.getElementById('new_password');
const pw2  = document.getElementById('confirm_password');
const msg  = document.getElementById('matchMsg');
const btn  = document.getElementById('submitBtn');

function checkMatch() {
  if (!pw2.value) { msg.textContent = ''; return; }
  if (pw1.value === pw2.value) {
    msg.textContent = '✓ Passwords match';
    msg.className   = 'form-text text-success';
    btn.disabled    = false;
  } else {
    msg.textContent = '✗ Passwords do not match';
    msg.className   = 'form-text text-danger';
    btn.disabled    = true;
  }
}
pw1.addEventListener('input', checkMatch);
pw2.addEventListener('input', checkMatch);
</script>
{% endblock %}
