<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — LSPU ScholarHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #01579b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .change-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 480px;
            width: 100%;
        }
        .icon-shield {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .icon-shield i {
            font-size: 36px;
            color: white;
        }
        .form-control:focus {
            border-color: #1a237e;
            box-shadow: 0 0 0 0.2rem rgba(26, 35, 126, 0.25);
        }
        .btn-change {
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            border: none;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .btn-change:hover {
            background: linear-gradient(135deg, #0d47a1, #01579b);
        }
        .alert { border-radius: 10px; }
    </style>
</head>
<body>
    <div class="change-card">
        <div class="icon-shield">
            <i class="bi bi-shield-lock"></i>
        </div>

        <h4 class="text-center fw-bold mb-2" style="color: #1a237e;">Change Your Password</h4>
        <p class="text-center text-muted mb-4">
            For security, you must change your temporary password before accessing the system.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.force_change_password') }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    <i class="bi bi-lock me-1"></i>New Password
                </label>
                <input type="password" class="form-control" name="new_password"
                       placeholder="Enter new password (min. 8 characters)" required minlength="8" autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">
                    <i class="bi bi-lock-fill me-1"></i>Confirm New Password
                </label>
                <input type="password" class="form-control" name="confirm_password"
                       placeholder="Re-enter new password" required minlength="8">
            </div>
            <button type="submit" class="btn btn-change text-white w-100 mb-3">
                <i class="bi bi-check-circle me-1"></i>Change Password & Continue
            </button>
        </form>

        <div class="text-center">
            <a href="{{ url_for('auth.logout') }}" class="text-muted text-decoration-none small">
                <i class="bi bi-box-arrow-left me-1"></i>Log out instead
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
