name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Check the schema matches the models
        run: python scripts/check_schema.py --create --url "sqlite:////tmp/schema_check.sqlite"

  pytest-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lspu_scholarhub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/lspu_scholarhub_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The unique batch index, the savepoint retry and enum storage only get
      # their production dialect exercised here.
      - name: Run tests against MySQL
        run: |
          set +e
          python -m pytest tests -q > /tmp/pytest-mysql.log 2>&1
          status=$?
          tail -n 40 /tmp/pytest-mysql.log
          if [ $status -ne 0 ]; then
            echo "::error title=MySQL tests failed::$(tail -n 15 /tmp/pytest-mysql.log | tr '\n' ' ' | tr -d '\r')"
          fi
          exit $status
